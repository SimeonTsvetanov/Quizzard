version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 1 }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    ignore:
      # @types/node follows the Node version we run (engines >=24, CI node 24) — bump both on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
  # Vendored mini-apps (vendor/*, PLAN T-10): a PR when a mini-app repo's default branch moves. Bump
  # only to a released commit of that repo (its CHANGELOG), then run `pnpm verify` and the e2e here.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule: { interval: weekly }
