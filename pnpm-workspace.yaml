# Supply chain policy — engineering templates/pnpm-workspace.yaml (APP-STANDARD §8).
packages:
  - packages/*
  - app
  # Mini-apps vendored as git submodules (PLAN §1.1 item 2): only their core and mini-app packages,
  # never their standalone app/, mcp or root (their own workspace file and lockfile stay unused).
  - miniapps/*/packages/core
  - miniapps/*/packages/miniapp
  # The quiz creator's player (docs/quiz-creator PLAN §2): built into one HTML template for "Export to play".
  - miniapps/*/packages/player

minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
trustPolicy: no-downgrade
trustPolicyExclude:
  # Moni's decision 2026-11-05 (DECISIONS): Google's workbox-build 7.4.1 (via vite-plugin-pwa 2.0.0)
  # depends on this single-maintainer fork published without provenance. Exact version only;
  # /check-stack removes it once workbox stops depending on it.
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
blockExoticSubdeps: true

# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  sharp: true
